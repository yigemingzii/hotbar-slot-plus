name: 构建

on:
  push:
  pull_request:

jobs:
  build:
    name: 构建 Mod
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: 上传 Jar
        uses: actions/upload-artifact@v4
        with:
          name: hotbar-slot-plus
          path: build/libs/*.jar
